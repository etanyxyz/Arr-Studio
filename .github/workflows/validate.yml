name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Lint, tests, frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "homeassistant==2025.1.4" pytest pytest-asyncio ruff
      - run: ruff check .
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check_frontend.mjs

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hassfest
        run: docker run --rm -v "${{ github.workspace }}":/github/workspace ghcr.io/home-assistant/hassfest --integration-path /github/workspace/custom_components/arr_studio

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
